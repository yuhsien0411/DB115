<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾物商店 · 商品瀏覽</title>

<link rel="stylesheet" href="/common.css"><script defer src="/common.js"></script><script defer src="/store/store.js"></script>
</head>
<body class="storefront">
<svg class="sprite" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 7h14l2 14H3L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v9M7 5.5l9 5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h19M7 16v-5M12 16V7M17 16V4"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="19" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 8M20 3v7h-7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>

<aside class="sidebar"><a class="brand" href="#products"><span class="brand-mark">拾</span><span>拾物商店<small>SHIWU · STORE</small></span></a><nav aria-label="商店導覽"><a href="#products" data-page="products"><svg><use href="#i-box"/></svg>商品瀏覽</a><a href="#orders" data-page="orders"><svg><use href="#i-list"/></svg>我的訂單</a></nav></aside>
<div class="shell">
<header class="topbar"><div><span class="breadcrumb">商店</span><span class="slash">/</span><span id="crumb">商品瀏覽</span></div><div class="top-actions"><label class="customer-switch">目前顧客 <select id="current-customer" aria-label="目前顧客"></select></label><button class="cart-trigger" data-action="cart"><svg><use href="#i-bag"/></svg><span>購物車</span><span id="cart-count" class="cart-count">0</span></button></div></header>
<main id="main" tabindex="-1"><div class="loading">正在連接商店資料…</div></main>
<footer><span>拾物商店 · 電商核心流程展示</span><span>展示顧客選單 · 未串接金流</span></footer>
</div>
<dialog id="product-dialog" class="product-dialog" aria-labelledby="product-title"></dialog>
<dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
<dialog id="order-dialog" class="order-dialog" aria-labelledby="order-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
